services:
  - type: web
    name: ecopulse
    runtime: node
    plan: free
    buildCommand: npm install && npm rebuild better-sqlite3 && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
